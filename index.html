<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>轻游宇宙 - 24款高质量网页小游戏</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="hero-inner">
      <h1>轻游宇宙</h1>
      <p>24 款小游戏 | 触屏 + 键盘 | 手机/平板/电脑全支持</p>
      <div class="status-row">
        <span id="onlineBadge" class="badge">网络检测中</span>
        <span id="netMode" class="badge badge-alt">模式检测中</span>
        <span id="countBadge" class="badge">游戏 0 个</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel catalog">
      <div class="panel-head">
        <h2>游戏大厅</h2>
        <p>像 4399 一样直接点开就玩</p>
      </div>
      <input id="searchInput" class="search" placeholder="搜索游戏名，例如：冰火、射击、2048" />
      <div id="tagRow" class="tag-row"></div>
      <div id="gameGrid" class="game-grid"></div>
    </aside>

    <section class="panel stage">
      <div class="panel-head">
        <h2 id="activeTitle">请选择游戏</h2>
        <p id="activeDesc">下方会显示操作提示</p>
      </div>
      <div id="metaBar" class="meta-bar"></div>
      <div id="gameHost" class="game-host"></div>
      <div id="controls" class="controls"></div>
    </section>
  </main>

  <footer class="footer">
    <p>首次打开后会缓存核心资源，弱网也能继续玩。</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
